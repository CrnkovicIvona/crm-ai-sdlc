name: Feature request
description: Propose a product or engineering change
title: '[FEATURE] '
labels: ['feature']
body:
  - type: textarea
    id: request
    attributes:
      label: Business request
      description: State only known needs. Do not ask the agent to invent requirements.
    validations:
      required: true
  - type: textarea
    id: unknowns
    attributes:
      label: Open questions
      description: What must a human still decide?
  - type: dropdown
    id: risk
    attributes:
      label: Initial risk guess
      options: [Low, Medium, High, Critical]
    validations:
      required: true
  - type: input
    id: work_item
    attributes:
      label: Work item ID
      description: e.g. CRM-001. Agent starts with feature-orchestrator.
  - type: dropdown
    id: lifecycle
    attributes:
      label: Lifecycle state (if known)
      options:
        [
          REQUESTED,
          REQUIREMENTS,
          SPECIFIED,
          READY,
          PLANNED,
          IN_DEVELOPMENT,
          TESTING,
          IN_QA,
          RELEASED,
        ]
  - type: markdown
    attributes:
      value: |
        Specs: functional = WHAT, technical = HOW. Do not mark Ready here
        unless you are recording human Definition of Ready. Implementation
        plans require Ready first. Coding requires PLANNED.
        Process: `docs/sdlc/lifecycle.md`.
