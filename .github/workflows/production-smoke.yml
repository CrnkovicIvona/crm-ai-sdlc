name: Production smoke

# Runs after a successful Vercel Production deployment, or on demand.
# Does not run on pull requests. Does not deploy the SPA. Missing
# secrets FAIL the job (SKIPPED is not PASSED).
# Apply uses SQL on origin/main only.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production origin with no trailing slash
        required: false
        type: string

permissions:
  contents: read

jobs:
  apply-schema:
    name: Apply production schema
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.deployment_status.state == 'success' &&
        (
          github.event.deployment.environment == 'Production' ||
          github.event.deployment.environment == 'production'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Push migrations from main
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_SUPABASE_DB_URL:-}" ]; then
            echo "Missing GitHub secret PRODUCTION_SUPABASE_DB_URL (production Postgres URI). Never VITE_*. Do not print the value." >&2
            exit 1
          fi
          csv_count() {
            supabase --output csv db query --db-url "$PRODUCTION_SUPABASE_DB_URL" "$1" \
              | tail -n 1 \
              | tr -d '\r[:space:]'
          }
          record_if_present() {
            local version="$1"
            local table="$2"
            local tables hist_tables recorded
            tables="$(csv_count "select count(*) from information_schema.tables where table_schema = 'public' and table_name = '${table}'")"
            if [ "$tables" != "1" ]; then
              echo "public.${table} not found; leaving ${version} for db push"
              return 0
            fi
            hist_tables="$(csv_count "select count(*) from information_schema.tables where table_schema = 'supabase_migrations' and table_name = 'schema_migrations'")"
            if [ "$hist_tables" = "1" ]; then
              recorded="$(csv_count "select count(*) from supabase_migrations.schema_migrations where version = '${version}'")"
              if [ "$recorded" != "0" ]; then
                echo "${version} already recorded"
                return 0
              fi
            fi
            echo "Recording ${version} as applied (public.${table} already exists; no row changes)"
            supabase migration repair --db-url "$PRODUCTION_SUPABASE_DB_URL" --status applied --yes "$version"
          }
          record_if_present 20260822150000 profiles
          record_if_present 20260823190000 clients
          record_if_present 20260823210000 products
          supabase db push --db-url "$PRODUCTION_SUPABASE_DB_URL" --yes
          echo "Applied supabase/migrations from main. Do not treat this as smoke PASSED." >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Production smoke
    needs: apply-schema
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.deployment_status.state == 'success' &&
        (
          github.event.deployment.environment == 'Production' ||
          github.event.deployment.environment == 'production'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Resolve production URL
        id: url
        env:
          INPUT_URL: ${{ github.event.inputs.base_url }}
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          VAR_URL: ${{ vars.SMOKE_BASE_URL }}
        run: |
          set -euo pipefail
          URL="${INPUT_URL:-}"
          if [ -z "$URL" ]; then URL="${DEPLOY_URL:-}"; fi
          if [ -z "$URL" ]; then URL="${VAR_URL:-}"; fi
          URL="${URL%/}"
          if [ -z "$URL" ]; then
            echo "Set workflow input base_url, GitHub variable SMOKE_BASE_URL, or use a Production deployment_status environment_url." >&2
            exit 1
          fi
          echo "SMOKE_BASE_URL=$URL" >> "$GITHUB_ENV"
          echo "Using SMOKE_BASE_URL=$URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Production smoke tests
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_VIEWER_EMAIL: ${{ secrets.E2E_VIEWER_EMAIL }}
          E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}
        run: npm run test:smoke
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Record outcome
        if: always()
        run: |
          echo "Production smoke is PASSED only if this job succeeded." >> "$GITHUB_STEP_SUMMARY"
          echo "SKIPPED or missing secrets is not PASSED. Merge to main is ON_MAIN until this job PASSES." >> "$GITHUB_STEP_SUMMARY"
