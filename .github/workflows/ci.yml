name: CI

on:
  pull_request:
    branches: [test, main]
  push:
    branches: [test]

permissions:
  contents: read
  pull-requests: read

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run format:check

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: wagoid/commitlint-github-action@v6

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Detect secrets
        run: gitleaks detect --source . --verbose --no-banner --redact

  # CI reporting: PASSED | FAILED | SKIPPED | NOT APPLICABLE.
  # GitHub has no native NOT APPLICABLE conclusion. When there is no
  # application source, ESLint / Vitest / Playwright jobs are skipped at
  # the job level (GitHub: SKIPPED) and the detector summary states
  # NOT APPLICABLE. A skipped or N/A suite is not passed.
  application-source:
    name: Detect application source
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Check for src/
        run: |
          if [ -d src ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Application source found. ESLint, Vitest, and Playwright will run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Application suites: NOT APPLICABLE"
              echo ""
              echo "Reason: no application source directory (\`src/\`)."
              echo ""
              echo "| Suite | Status |"
              echo "| --- | --- |"
              echo "| ESLint | NOT APPLICABLE (job SKIPPED; not executed; not passed) |"
              echo "| Vitest | NOT APPLICABLE (job SKIPPED; not executed; not passed) |"
              echo "| Playwright | NOT APPLICABLE (job SKIPPED; not executed; not passed) |"
            } >> "$GITHUB_STEP_SUMMARY"

  eslint:
    name: ESLint
    needs: application-source
    if: needs.application-source.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint

  vitest:
    name: Vitest
    needs: application-source
    if: needs.application-source.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test

  playwright:
    name: Playwright
    needs: application-source
    if: needs.application-source.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright test
