name: CI

on:
  pull_request:
    branches: [test, main]
  push:
    branches: [test]

permissions:
  contents: read
  pull-requests: read

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ./commitlint.config.mjs

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Detect secrets
        run: gitleaks detect --source . --verbose --no-banner --redact

  # CI reporting: PASSED | FAILED | SKIPPED | NOT APPLICABLE.
  # GitHub has no native NOT APPLICABLE conclusion. When there is no
  # application source, ESLint / Vitest / Playwright jobs are skipped at
  # the job level (GitHub: SKIPPED) and the detector summary states
  # NOT APPLICABLE. A skipped or N/A suite is not passed.
  application-source:
    name: Detect application source
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        name: Check for src/
        run: |
          if [ -d src ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Application source found. ESLint, Vitest, and Playwright will run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Application suites: NOT APPLICABLE"
            echo "Reason: no application source directory (src/)."
            echo "ESLint, Vitest, and Playwright will be SKIPPED. They were not executed and are not passed."
            echo "## Application suites: NOT APPLICABLE" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Reason: no application source directory (src/)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Suite | Status |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| ESLint | NOT APPLICABLE (job SKIPPED; not executed; not passed) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Vitest | NOT APPLICABLE (job SKIPPED; not executed; not passed) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Playwright | NOT APPLICABLE (job SKIPPED; not executed; not passed) |" >> "$GITHUB_STEP_SUMMARY"
          fi

  eslint:
    name: ESLint
    needs: application-source
    if: needs.application-source.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  vitest:
    name: Vitest
    needs: application-source
    if: needs.application-source.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit and integration tests
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_VIEWER_EMAIL: ${{ secrets.E2E_VIEWER_EMAIL }}
          E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL_TEST }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY_TEST }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm test
      - name: Note skipped vs passed
        if: always()
        run: |
          echo "Vitest SKIPPED tests are not PASSED. RLS (TC-C012–C019) needs VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, and E2E_*. Never put the service role in a VITE_* secret." >> "$GITHUB_STEP_SUMMARY"

  vitest-local-rls:
    name: Vitest local RLS (TC-D015)
    needs: application-source
    if: needs.application-source.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start local Supabase
        run: supabase start
      - name: Seed ADMIN and VIEWER
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export VITE_SUPABASE_URL="$API_URL"
          export VITE_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export E2E_ADMIN_EMAIL="admin.local@bank.example"
          export E2E_ADMIN_PASSWORD="LocalAdminPass1"
          export E2E_VIEWER_EMAIL="viewer.local@bank.example"
          export E2E_VIEWER_PASSWORD="LocalViewerPass1"
          node scripts/seed-local-auth.mjs
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "E2E_ADMIN_EMAIL=$E2E_ADMIN_EMAIL"
            echo "E2E_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD"
            echo "E2E_VIEWER_EMAIL=$E2E_VIEWER_EMAIL"
            echo "E2E_VIEWER_PASSWORD=$E2E_VIEWER_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: TC-D015 against local PostgREST RLS
        env:
          TC_D015_REQUIRE_VIEW: '1'
        run: npx vitest run tests/integration/dashboard-stamps.test.ts --reporter=verbose
      - run: npx playwright install --with-deps chromium
      - name: TC-D015-ui dashboard surface ADMIN vs VIEWER
        env:
          TC_D015_REQUIRE_VIEW: '1'
          CI: 'true'
        run: npx playwright test tests/e2e/dashboard.spec.ts --grep "TC-D015-ui" --reporter=list
      - name: Note TC-D015
        if: always()
        run: |
          echo "This job applies repo migrations (including client_lifecycle_stamps) on local Supabase. A skip here is not a pass." >> "$GITHUB_STEP_SUMMARY"

  playwright:
    name: Playwright
    needs: application-source
    if: needs.application-source.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_VIEWER_EMAIL: ${{ secrets.E2E_VIEWER_EMAIL }}
          E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL_TEST }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY_TEST }}
        run: npx playwright test --reporter=list
      - name: Note skipped vs passed
        if: always()
        run: |
          echo "Playwright SKIPPED tests are not PASSED. Live Auth needs E2E_* plus VITE_SUPABASE_URL (or *_TEST alias mapped in this job)." >> "$GITHUB_STEP_SUMMARY"
